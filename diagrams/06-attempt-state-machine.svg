  --info: #38BDF8;
  --error: #EF4444;
  --accent: #2563EB;
  --border: #27272A;
  --primary: #000000;
  --success: #22C55E;
  --surface: #1E1E20;
  --warning: #FACC15;
  --secondary: #18181B;
  --text-muted: #52525B;
  --background: #0A0A0A;
  --text-primary: #F4F4F5;
  --text-secondary: #A1A1AA;
}
svg { display: block; margin-inline: auto; max-width: none; 
  --_bg: var(--background); --_fg: var(--text-primary); --_m: var(--text-secondary);
  --_l: var(--text-secondary); --_s: var(--surface); --_a: var(--secondary);
  --_b: var(--text-secondary); --_c: var(--accent); --_r: 4px;
  --_fm: monospace; --_hw: 600; color: var(--text-primary); fill: var(--text-primary);
  font: 16px Arial, sans-serif; letter-spacing: normal; word-spacing: normal; direction: ltr; }
#diagram-06 [data-id="planned"] &gt; rect, #diagram-06 [data-id="awaiting_review"] &gt; rect { stroke: var(--info); stroke-width: 2px; }
#diagram-06 [data-id="completed"] &gt; rect { stroke: var(--success); stroke-width: 2px; }
#diagram-06 [data-id="quota"] &gt; rect, #diagram-06 [data-id="needs_attention"] &gt; rect, #diagram-06 [data-id="awaiting_trigger"] &gt; rect { stroke: var(--warning); stroke-width: 2px; }
#diagram-06 [data-id="failed"] &gt; rect, #diagram-06 [data-id="invalid_input"] &gt; rect, #diagram-06 [data-id="timed_out"] &gt; rect { stroke: var(--error); stroke-width: 2px; }
</style>
