<svg id="diagram-01" xmlns="http://www.w3.org/2000/svg" viewBox="-16 -72 1366 735" width="1366" height="735" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description">
<title id="diagram-title">System context</title>
<desc id="diagram-description">A Developer Experience Engineer runs campaigns, a Staff Software Engineer validates findings, and an Engineering Manager compares outcomes for rollout. Proofline, Greptile, and CodeRabbit review separate pull requests in GitHub. GitHub Actions and AWS Lambda provide deployment evidence when relevant.</desc>
