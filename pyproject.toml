[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siftbench"
version = "0.1.0"
description = "An evidence-first benchmark for AI code reviewers"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reviewbench = "reviewbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reviewbench.report" = ["*.css", "*.js", "*.woff2", "*.svg", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
