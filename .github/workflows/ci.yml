name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python -m compileall -q src
      - run: reviewbench --help
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist/release .
          python -m pip install --no-deps dist/release/*.whl
          (cd dist/release && sha256sum *.whl > SHA256SUMS)
      - name: Exercise the installed CLI without credentials
        run: |
          fixture=benchmark/fixtures/pagination
          reviewbench --state-dir "$RUNNER_TEMP/siftbench" run --manifest "$fixture/campaign.toml" --fixture "$fixture/reviews.json"
          reviewbench --state-dir "$RUNNER_TEMP/siftbench" report --run-id pagination-pilot --out "$RUNNER_TEMP/siftbench-report"
          reviewbench export --bundle "$RUNNER_TEMP/siftbench-report/results.json" --visibility public --out "$RUNNER_TEMP/siftbench-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siftbench-wheel
          if-no-files-found: error
          path: |
            dist/release/*.whl
            dist/release/SHA256SUMS
